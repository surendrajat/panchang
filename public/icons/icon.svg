      <stop offset="0%" stop-color="#fdf6e3" />
      <stop offset="100%" stop-color="#e8d9a6" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- Stylised sun + moon over a horizon line -->
  <circle cx="256" cy="220" r="118" fill="none" stroke="#8b1818" stroke-width="14" />
  <path d="M 256 102 A 118 118 0 0 1 256 338 A 78 78 0 0 0 256 102 Z" fill="#8b1818" />
  <line x1="80" y1="380" x2="432" y2="380" stroke="#1a237e" stroke-width="14" stroke-linecap="round" />
  <!-- 27 nakshatra ticks across the bottom -->
  <g fill="#1a237e">
    <g id="ticks">
